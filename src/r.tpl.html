<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<meta name="theme-color" content="#12100E">
<title>OBSKURA 360 — etkinlik raporu</title>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Figtree:wght@400;500;600;800&family=IBM+Plex+Mono:wght@500;600&display=swap">
<style>
:root{--ink:#12100E;--ink2:#1B1714;--line:rgba(243,237,228,.14);--line2:rgba(243,237,228,.3);--paper:#F6F0E6;--text:#F3EDE4;--muted:#A79688;--faint:#6E625A;--amber:#F2A93B;--amber2:#8A6526;
  --disp:"Instrument Serif",Georgia,serif;--ui:"Figtree",-apple-system,"Segoe UI",sans-serif;--mono:"IBM Plex Mono",ui-monospace,Menlo,monospace}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
[hidden]{display:none!important}
html,body{margin:0;min-height:100%;background:var(--ink);color:var(--text);font-family:var(--ui)}
.wrap{max-width:760px;margin:0 auto;padding:40px 20px 70px}
.eyebrow{font-family:var(--disp);letter-spacing:.36em;font-size:11px;color:var(--muted);text-transform:uppercase}
h1{font-family:var(--disp);font-style:italic;font-weight:400;font-size:clamp(30px,6vw,50px);margin:10px 0 6px;color:var(--paper);line-height:1.08}
h1 em{color:var(--amber);font-style:italic}
.tarih{color:var(--muted);font-size:15px;margin-bottom:32px}
h2{font-family:var(--mono);font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--amber);margin:38px 0 14px;font-weight:600}

.big{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:1px;background:var(--line2);
  border:1px solid var(--line2);border-radius:4px;overflow:hidden;margin-bottom:8px}
.big div{background:var(--ink2);padding:20px 18px}
.big .k{font-family:var(--mono);font-size:10px;letter-spacing:.13em;text-transform:uppercase;color:var(--faint);margin-bottom:8px}
.big .v{font-family:var(--mono);font-size:34px;font-weight:600;color:var(--amber);line-height:1;font-variant-numeric:tabular-nums}
.big .v small{display:block;font-family:var(--ui);font-size:12.5px;font-weight:400;color:var(--muted);margin-top:7px;letter-spacing:0;line-height:1.45}
.big .v.sade{color:var(--paper)}

/* saat grafiği */
.graf{border:1px solid var(--line);border-radius:4px;padding:20px 18px 14px;background:var(--ink2)}
.cub{display:flex;align-items:flex-end;gap:5px;height:140px;margin-bottom:8px}
.cub .s{flex:1;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;height:100%;min-width:0}
.cub .b{width:100%;background:var(--amber2);border-radius:3px 3px 0 0;min-height:2px;position:relative}
.cub .s.pik .b{background:var(--amber)}
.cub .say{font-family:var(--mono);font-size:10px;color:var(--muted);margin-bottom:4px;font-variant-numeric:tabular-nums}
.cub .s.pik .say{color:var(--amber);font-weight:600}
.eks{display:flex;gap:5px;border-top:1px solid var(--line);padding-top:7px}
.eks span{flex:1;text-align:center;font-family:var(--mono);font-size:10px;color:var(--faint);min-width:0}
.grafNot{font-size:12.5px;color:var(--faint);margin-top:10px;line-height:1.6}

.row{display:flex;gap:10px;flex-wrap:wrap;margin:26px 0 0}
.btn{display:inline-flex;align-items:center;justify-content:center;min-height:54px;padding:0 24px;border:none;border-radius:999px;
  font-family:var(--ui);font-weight:600;font-size:15px;background:var(--amber);color:#1A1206;cursor:pointer;text-decoration:none}
.btn.ghost{background:transparent;color:var(--text);box-shadow:inset 0 0 0 1.5px var(--line2)}
.msg{text-align:center;color:var(--muted);font-size:14px;line-height:1.7;padding:44px 10px}
.msg b{color:var(--paper)}
footer{margin-top:46px;padding-top:22px;border-top:1px solid var(--line);display:flex;justify-content:space-between;align-items:center;gap:14px;flex-wrap:wrap}
.imza{font-family:var(--disp);letter-spacing:.3em;font-size:11px;color:var(--muted);text-transform:uppercase}
.imza b{color:var(--amber);font-weight:400}
.kucuk{font-size:11.5px;color:var(--faint)}
@media print{
  html,body{background:#fff;color:#231D18}
  .wrap{padding:0}
  .btn,.row{display:none}
  .big div,.graf{background:#F4EFE6;-webkit-print-color-adjust:exact;print-color-adjust:exact}
  h1,.big .v.sade{color:#171310}
}
</style>
</head>
<body>
<div class="wrap">
  <div class="eyebrow">OBSKURA 360 · Etkinlik Raporu</div>
  <h1 id="baslik">Etkinlik <em>raporu</em></h1>
  <div class="tarih" id="tarih">Hazırlanıyor…</div>

  <div id="icerik" hidden>
    <div class="big">
      <div><div class="k">Çekilen video</div><div class="v" id="oSayi">—</div></div>
      <div><div class="k">En yoğun saat</div><div class="v sade" id="oPik">—</div></div>
      <div><div class="k">Süre</div><div class="v sade" id="oSure">—</div></div>
    </div>

    <h2>Saat saat dağılım</h2>
    <div class="graf">
      <div class="cub" id="cub"></div>
      <div class="eks" id="eks"></div>
      <div class="grafNot" id="grafNot"></div>
    </div>

    <div class="row">
      <a class="btn" id="galeriBtn" href="#" target="_blank" rel="noopener">Videoları izle</a>
      <button class="btn ghost" id="yazdir">Yazdır / PDF</button>
    </div>
  </div>

  <div class="msg" id="msg" hidden></div>

  <footer>
    <div class="imza">Y O P I &nbsp;·&nbsp; <b>OBSKURA 360</b></div>
    <div class="kucuk" id="dip"></div>
  </footer>
</div>
<script>
(function(){
"use strict";
function $(s){return document.querySelector(s)}
var q=new URLSearchParams(location.hash.replace(/^#/,""));
var cloud=q.get("c")||"",tag=q.get("t")||"",evt=q.get("e")||"",gal=q.get("g")||"";
if(evt)$("#baslik").innerHTML=evt.replace(/</g,"&lt;")+" <em>raporu</em>";
if(gal)$("#galeriBtn").href=gal; else $("#galeriBtn").hidden=true;
$("#yazdir").onclick=function(){window.print()};
function hata(t){$("#msg").hidden=false;$("#msg").innerHTML=t;$("#tarih").textContent=""}
function iki(n){return (n<10?"0":"")+n}
function trTarih(iso){
  if(!iso)return "";
  var d=new Date(iso);if(isNaN(d))return "";
  var ay=["Ocak","Şubat","Mart","Nisan","Mayıs","Haziran","Temmuz","Ağustos","Eylül","Ekim","Kasım","Aralık"];
  return d.getDate()+" "+ay[d.getMonth()]+" "+d.getFullYear();
}
function saatOf(iso){var d=new Date(iso);return isNaN(d)?null:d.getHours()}

if(!cloud||!tag){hata("Bağlantı eksik — rapor adresini panelden yeniden alın.");}
else{
fetch("https://res.cloudinary.com/"+encodeURIComponent(cloud)+"/video/list/"+encodeURIComponent(tag)+".json",{cache:"no-store"})
.then(function(r){
  if(r.status===404)return {resources:[]};
  if(!r.ok)throw new Error("HTTP "+r.status);
  return r.json();
})
.then(function(j){
  var rs=(j.resources||[]).filter(function(x){return String(x.public_id||"").indexOf("/_")<0});
  if(!rs.length){hata("Bu etkinlikte henüz video yok.<br>Çekimler başladıktan sonra rapor kendiliğinden dolar.");return}

  /* saatler misafirin değil, RAPORU AÇANIN saat diliminde okunur — created_at UTC gelir */
  var saat={},zaman=[];
  rs.forEach(function(x){
    var c=x.created_at;if(!c)return;
    zaman.push(new Date(c));
    var h=saatOf(c);if(h!==null)saat[h]=(saat[h]||0)+1;
  });
  zaman.sort(function(a,b){return a-b});
  var ilk=zaman[0],son=zaman[zaman.length-1];

  $("#oSayi").innerHTML=rs.length+'<small>misafir videosu</small>';

  var pikH=null,pikN=0;
  Object.keys(saat).forEach(function(h){if(saat[h]>pikN){pikN=saat[h];pikH=+h}});
  $("#oPik").innerHTML=(pikH===null?"—":iki(pikH)+":00")+'<small>'+(pikN?pikN+" video bu saatte":"")+'</small>';

  var dk=(ilk&&son)?Math.round((son-ilk)/60000):0;
  var sa=Math.floor(dk/60),kdk=dk%60;
  $("#oSure").innerHTML=(sa?sa+" sa ":"")+kdk+" dk"+'<small>ilk çekimden sonuncuya</small>';

  $("#tarih").textContent=trTarih(ilk)+(ilk&&son&&trTarih(ilk)!==trTarih(son)?(" – "+trTarih(son)):"")+
    "  ·  "+iki(ilk.getHours())+":"+iki(ilk.getMinutes())+" – "+iki(son.getHours())+":"+iki(son.getMinutes());

  /* Saat aralığını GERÇEK zamanla yürüyerek kur — düğünler gece yarısını geçiyor.
     "23'ten 1'e say" diye kurulan döngü boş kalıyordu; her gece etkinliğinde grafik çizilmiyordu. */
  var liste=[],ad=new Date(ilk);ad.setMinutes(0,0,0);
  var bit=new Date(son);bit.setMinutes(0,0,0);
  var kilit=0;
  while(ad<=bit&&kilit<24){liste.push(ad.getHours());ad=new Date(ad.getTime()+3600000);kilit++}
  if(!liste.length)liste=[ilk.getHours()];
  var kirpik=false;
  if(liste.length>14){liste=liste.slice(0,14);kirpik=true}
  var enb=1;liste.forEach(function(h){if((saat[h]||0)>enb)enb=saat[h]});

  var cub=$("#cub"),eks=$("#eks");
  liste.forEach(function(h){
    var n=saat[h]||0,yuk=Math.round(n/enb*100);
    var s=document.createElement("div");s.className="s"+(h===pikH?" pik":"");
    s.innerHTML='<div class="say">'+(n||"")+'</div><div class="b" style="height:'+Math.max(yuk,n?4:1)+'%"></div>';
    cub.appendChild(s);
    var e=document.createElement("span");e.textContent=iki(h);eks.appendChild(e);
  });
  $("#grafNot").textContent="Sütunlar o saatte çekilen video sayısını gösteriyor. En yüksek sütun "+enb+" video."+
    (kirpik?"  (İlk 14 saat gösteriliyor.)":"");

  $("#icerik").hidden=false;
  $("#dip").textContent="Rapor "+trTarih(new Date().toISOString())+" tarihinde üretildi.";
  window.B360R={sayi:rs.length,pik:pikH,dk:dk};
})
.catch(function(e){
  hata("Rapor okunamadı ("+((e&&e.message)||"hata")+").<br>Cloudinary → Settings → Security → <b>Resource list</b> kısıtı kapalı olmalı.");
});
}
})();
</script>
</body>
</html>
