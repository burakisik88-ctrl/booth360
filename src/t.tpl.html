<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<meta name="theme-color" content="#12100E">
<title>OBSKURA 360 — Saha Kontrolü</title>
<style>
:root{--ink:#12100E;--ink2:#1B1714;--line:rgba(243,237,228,.14);--line2:rgba(243,237,228,.3);--paper:#F6F0E6;--text:#F3EDE4;--muted:#A79688;--amber:#F2A93B;--ok:#7BC47F;--err:#E8705A;
  --ui:-apple-system,"Segoe UI",Roboto,sans-serif}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
[hidden]{display:none!important}
html,body{margin:0;min-height:100%;background:var(--ink);color:var(--text);font-family:var(--ui);font-size:15px}
.wrap{max-width:620px;margin:0 auto;padding:22px 16px 70px}
h1{font-size:22px;margin:0 0 4px;color:var(--paper)}
h1 em{color:var(--amber);font-style:normal}
.sub{color:var(--muted);font-size:13px;margin-bottom:18px;line-height:1.5}
.btn{display:inline-flex;align-items:center;justify-content:center;min-height:52px;padding:0 22px;border:none;border-radius:999px;font-weight:600;font-size:15px;background:var(--amber);color:#1A1206;cursor:pointer;text-decoration:none}
.btn.ghost{background:transparent;color:var(--text);box-shadow:inset 0 0 0 1.5px var(--line2)}
.btn:disabled{opacity:.5}
.row{display:flex;gap:10px;flex-wrap:wrap;margin:14px 0 20px}
.it{display:flex;gap:11px;align-items:flex-start;padding:11px 12px;border-bottom:1px solid var(--line)}
.ic{width:22px;flex:0 0 22px;font-size:16px;line-height:1.35;text-align:center}
.tx{flex:1;min-width:0}
.nm{font-weight:600;font-size:14px}
.ds{color:var(--muted);font-size:12.5px;line-height:1.5;margin-top:2px;word-break:break-word}
.it.ok .nm{color:var(--ok)}.it.err .nm{color:var(--err)}.it.warn .nm{color:var(--amber)}
.sum{margin:18px 0;padding:15px;border-radius:14px;border:1px solid var(--line);background:var(--ink2);font-size:14px;line-height:1.6}
.sum.ok{border-color:rgba(123,196,127,.5)}.sum.err{border-color:rgba(232,112,90,.55)}
.sum b{color:var(--paper)}
.big{font-size:18px;font-weight:700}
video{width:150px;border-radius:10px;border:1px solid var(--line);background:#000;margin-top:8px;display:block}
.foot{margin-top:26px;color:var(--muted);font-size:11.5px;line-height:1.6}
code{font-size:11px;color:var(--amber);word-break:break-all}
</style>
</head>
<body>
<div class="wrap">
  <h1>Saha <em>Kontrolü</em></h1>
  <div class="sub" id="sub">Etkinlikten önce bir kez çalıştır. Bulut, efektler, müzik, karekod, kamera ve galeri tek tek denenir; kırmızı varsa misafir gelmeden düzeltilir.</div>
  <div class="row">
    <button class="btn" id="run">Kontrolü başlat</button>
    <a class="btn ghost" href="index.html">Uygulamaya dön</a>
  </div>
  <div id="list"></div>
  <div class="sum" id="sum" hidden></div>
  <div class="row"><button class="btn ghost" id="kopya" hidden>Sonucu kopyala</button></div>
  <div class="foot" id="foot"></div>
</div>
<script>
/*ENGINE*/
</script>
<script>
(function(){
"use strict";
function $(s){return document.querySelector(s)}
var S={};try{S=JSON.parse(localStorage.getItem("booth360.v1")||"{}")}catch(e){}
var CLD=S.cldName||"rqhgtbvd", PRE=S.cldPreset||"booth_qr", FXP=S.fxPath||"booth360/_fx";
var L=$("#list"),rap=[],hata=0,uyari=0;
function base(){return "https://res.cloudinary.com/"+encodeURIComponent(CLD)+"/video/upload/"}
function slug(){var s=(S.evt||"etkinlik").toString().toLowerCase();try{s=s.normalize("NFD").replace(/[̀-ͯ]/g,"")}catch(e){}
  return (s.replace(/ı/g,"i").replace(/[^a-z0-9]+/g,"-").replace(/^-+|-+$/g,"")||"etkinlik").slice(0,40)}
function add(nm){var d=document.createElement("div");d.className="it";
  d.innerHTML='<div class="ic">⏳</div><div class="tx"><div class="nm"></div><div class="ds">deneniyor…</div></div>';
  d.querySelector(".nm").textContent=nm;L.appendChild(d);return d}
function set(d,dur,ds,nm){
  d.className="it "+(dur==="ok"?"ok":(dur==="warn"?"warn":"err"));
  d.querySelector(".ic").textContent=dur==="ok"?"✔":(dur==="warn"?"!":"✘");
  d.querySelector(".ds").textContent=ds;
  if(nm)d.querySelector(".nm").textContent=nm;
  if(dur==="err")hata++;if(dur==="warn")uyari++;
  rap.push((dur==="ok"?"OK  ":(dur==="warn"?"UYARI ":"HATA "))+d.querySelector(".nm").textContent+" — "+ds);
}
function head(u,ms){
  return new Promise(function(res){
    var t=setTimeout(function(){res({s:0,e:"zaman aşımı"})},ms||25000);
    fetch(u,{method:"HEAD",cache:"no-store"}).then(function(r){clearTimeout(t);res({s:r.status,r:r})},
      function(e){clearTimeout(t);res({s:0,e:(e&&e.message)||"bağlantı yok"})});
  });
}
/* Cloudinary ilk üretimde 423 döner; hazır olana kadar bekle */
function bekle(u,sn){
  var t0=Date.now();
  return new Promise(function(res){
    (function tik(){
      head(u,20000).then(function(x){
        if(x.s===200||x.s===206){res({s:200,sn:Math.round((Date.now()-t0)/1000)});return}
        if(Date.now()-t0>(sn||90)*1000){res({s:x.s,sn:Math.round((Date.now()-t0)/1000),e:x.e});return}
        if(x.s===423||x.s===425||x.s===429||x.s===0||x.s>=500){setTimeout(tik,2500);return}
        res({s:x.s,sn:Math.round((Date.now()-t0)/1000)});
      });
    })();
  });
}
/* 1 saniyelik minik test videosu üret (kamera + MediaRecorder gerçekten çalışıyor mu) */
function testKlip(){
  return new Promise(function(res,rej){
    try{
      var c=document.createElement("canvas");c.width=180;c.height=320;
      var x=c.getContext("2d"),n=0;
      var iv=setInterval(function(){n++;x.fillStyle="hsl("+(n*11%360)+",70%,45%)";x.fillRect(0,0,180,320);
        x.fillStyle="#fff";x.font="30px sans-serif";x.fillText("360",50,170)},40);
      var st=c.captureStream(25),mt="";
      ["video/mp4;codecs=avc1","video/mp4","video/webm;codecs=vp9","video/webm"].forEach(function(m){
        if(!mt&&window.MediaRecorder&&MediaRecorder.isTypeSupported(m))mt=m});
      var r=mt?new MediaRecorder(st,{mimeType:mt}):new MediaRecorder(st),ch=[];
      r.ondataavailable=function(e){if(e.data&&e.data.size)ch.push(e.data)};
      r.onstop=function(){clearInterval(iv);st.getTracks().forEach(function(t){t.stop()});
        res({blob:new Blob(ch,{type:ch[0]?ch[0].type:"video/webm"}),mt:mt||"varsayılan"})};
      r.start();setTimeout(function(){try{r.stop()}catch(e){clearInterval(iv);rej(e)}},1400);
    }catch(e){rej(e)}
  });
}
function yukle(blob){
  return new Promise(function(res,rej){
    var fd=new FormData();fd.append("file",blob);fd.append("upload_preset",PRE);
    fd.append("folder","booth360/_deneme");fd.append("tags","deneme-360");
    var xhr=new XMLHttpRequest();
    xhr.open("POST","https://api.cloudinary.com/v1_1/"+encodeURIComponent(CLD)+"/video/upload");
    xhr.timeout=90000;
    xhr.onload=function(){var j=null;try{j=JSON.parse(xhr.responseText)}catch(e){}
      if(xhr.status>=200&&xhr.status<300&&j&&j.public_id)res(j);
      else rej(new Error((j&&j.error&&j.error.message)||("reddedildi ("+xhr.status+")")))};
    xhr.onerror=function(){rej(new Error("bağlantı hatası"))};
    xhr.ontimeout=function(){rej(new Error("zaman aşımı"))};
    xhr.send(fd);
  });
}
function tl(sn){return ((+S.krediTl||21.31)*(sn/250))}

$("#run").onclick=function(){
  $("#run").disabled=true;L.innerHTML="";rap=[];hata=0;uyari=0;$("#sum").hidden=true;$("#kopya").hidden=true;
  var t0=Date.now(),toplamSn=0;
  var d;
  Promise.resolve()
  /* 1 — internet */
  .then(function(){d=add("İnternet");
    return head("https://api.cloudinary.com/v1_1/"+encodeURIComponent(CLD)+"/video/upload",12000).then(function(x){
      if(navigator.onLine&&x.s)set(d,"ok","Bağlantı var, Cloudinary'ye ulaşılıyor.");
      else if(navigator.onLine)set(d,"err","Telefon internete bağlı ama Cloudinary'ye ulaşılamıyor. Misafir wifi'si engelliyor olabilir — mobil veriye geç.");
      else set(d,"err","İnternet YOK. Yükleme ve karekod çalışmaz.");
    })})
  /* 2 — ayarlar */
  .then(function(){d=add("Ayarlar");
    var eks=[];if(!S.cldName)eks.push("cloud adı");if(!S.cldPreset)eks.push("upload preset");if(!S.evt)eks.push("etkinlik adı");
    if(eks.length)set(d,eks.indexOf("etkinlik adı")>=0&&eks.length===1?"warn":"err","Eksik: "+eks.join(", ")+". Panel → ilgili alanı doldur.");
    else set(d,"ok","cloud: "+CLD+" · preset: "+PRE+" · etkinlik: "+S.evt+" ("+slug()+")");
    if(S.deneme){var w=add("DENEME MODU AÇIK");set(w,"warn","Çekimler sayaca ve misafir galerisine yazmaz. Etkinlik başlarken panelden KAPAT.")}
  })
  /* 3 — kamera */
  .then(function(){d=add("Kamera");
    if(!navigator.mediaDevices||!navigator.mediaDevices.getUserMedia){set(d,"err","Tarayıcı kamerayı vermiyor. Safari kullan, sayfayı https ile aç.");return}
    return navigator.mediaDevices.getUserMedia({video:{facingMode:(S.kamera==="environment"?"environment":"user"),width:{ideal:1440},height:{ideal:1920},frameRate:{ideal:60}},audio:false})
      .then(function(st){
        var v=document.createElement("video");v.muted=true;v.playsInline=true;v.srcObject=st;
        return v.play().catch(function(){}).then(function(){return new Promise(function(r){setTimeout(r,600)})}).then(function(){
          var w=v.videoWidth,h=v.videoHeight,sg={};try{sg=st.getVideoTracks()[0].getSettings()||{}}catch(e){}
          var fps=Math.round(sg.frameRate||0);
          st.getTracks().forEach(function(t){t.stop()});
          var dik=h>w, oran=w&&h?(w/h):0;
          var msg=w+"×"+h+" @"+fps+"fps · "+(dik?"dikey":"YATAY")+" · en/boy "+oran.toFixed(2);
          if(!dik)set(d,"err",msg+" — telefon YATAY kare veriyor, video yarım görünür. Telefonu dik tut, uygulamayı kapatıp aç.");
          else if(fps&&fps<30)set(d,"warn",msg+" — kare hızı düşük, ağır çekim kalitesi zayıf olur. Işığı artır.");
          else set(d,"ok",msg+(oran>=0.7?" (geniş kadraj ✔)":" (dar kadraj — Panel → Kadraj'ı 'En geniş' yap)"));
        });
      },function(e){set(d,"err","Kamera izni verilmedi ("+((e&&e.name)||"hata")+"). Safari → Ayarlar → Kamera → İzin ver.")});
  })
  /* 4 — MediaRecorder + test klibi */
  .then(function(){d=add("Video kaydı (MediaRecorder)");
    return testKlip().then(function(k){
      window.__k=k;set(d,"ok","Kayıt çalışıyor · biçim: "+k.mt+" · "+Math.round(k.blob.size/1024)+" KB");
    },function(e){set(d,"err","Kayıt açılamadı: "+((e&&e.message)||"hata")+" — bu telefonda video çekilemez.")});
  })
  /* 5 — yükleme (unsigned preset) */
  .then(function(){d=add("Buluta yükleme");
    if(!window.__k){set(d,"err","Test klibi üretilemediği için denenemedi.");return}
    return yukle(window.__k.blob).then(function(j){
      window.__v={pid:j.public_id,ver:j.version,dur:+j.duration||1.4};
      set(d,"ok","Yüklendi → "+j.public_id+" ("+(window.__v.dur)+" sn). Preset unsigned ve açık.");
    },function(e){set(d,"err","Yüklenemedi: "+((e&&e.message)||"hata")+" — Cloudinary → Settings → Upload → preset '"+PRE+"' Unsigned olmalı.")});
  })
  /* 6 — FX videoları */
  .then(function(){d=add("Efekt videoları (FX)");
    var ids=["yildiz","kalp","konfeti","sparkle"],var_=[],yok=[];
    return Promise.all(ids.map(function(id){
      return head(base()+FXP+"/"+id+".mp4",20000).then(function(x){(x.s===200?var_:yok).push(id)});
    })).then(function(){
      if(!yok.length)set(d,"ok","4/4 yerinde: "+var_.join(", "));
      else if(var_.length)set(d,"warn",var_.length+"/4 yerinde. EKSİK: "+yok.join(", ")+" — o şablonlar efektsiz çalışır.");
      else set(d,"err","Hiçbiri yok ("+FXP+"). Panel → Efekt Katmanı → videoları yükle, ya da paketi 'Editli · efektsiz' yap.");
    });
  })
  /* 7 — logo */
  .then(function(){d=add("Logo");
    if(!S.logoPid){set(d,"warn","Logo yüklü değil — videoya logo binmez. Markalı iş satıyorsan panelden yükle.");return}
    return head("https://res.cloudinary.com/"+encodeURIComponent(CLD)+"/image/upload/"+S.logoPid,20000).then(function(x){
      if(x.s===200)set(d,"ok","Yerinde: "+S.logoPid+" · konum "+(S.logoPoz||"ne")+" · boy "+(S.logoW||"0.22"));
      else set(d,"err","Logo bulunamadı ("+x.s+"): "+S.logoPid+" — panelden yeniden yükle.");
    });
  })
  /* 8 — MÜZİK: dosya + gerçek ses katmanı render'ı */
  .then(function(){d=add("Müzik");
    var m=(S.tplMusic&&Object.keys(S.tplMusic).length)?S.tplMusic[Object.keys(S.tplMusic)[0]]:S.muzikSec;
    if(!m){set(d,"warn","Seçili müzik yok — videolar sessiz gider. Panel → Müzik'ten yükle ve 'Genel yap'.");return}
    return head(base()+m+".mp3",25000).then(function(x){
      if(x.s!==200)return head(base()+m+".mp4",25000).then(function(y){return {s:y.s,alt:1}});
      return x;
    }).then(function(x){
      if(x.s!==200){set(d,"err","Müzik dosyası bulunamadı ("+x.s+"): "+m+" — panelden yeniden yükle.");return}
      /* asıl test: ses katmanı gerçekten videoya biniyor mu */
      var u=base()+"so_0,du_3/l_audio:"+String(m).replace(/\//g,":")+",du_3.5/fl_layer_apply/"+FXP+"/sparkle.mp4";
      return bekle(u,90).then(function(r){
        if(r.s===200)set(d,"ok","Dosya yerinde ("+m+") ve ses katmanı videoya biniyor ✔ ("+r.sn+" sn'de hazırlandı).");
        else set(d,"err","Dosya var ama SES KATMANI KURULMUYOR (HTTP "+r.s+"). Müziği MP3 olarak yeniden yükle; m4a/aac olmasın.");
      });
    });
  })
  /* 9 — 6 şablonun her biri gerçekten render oluyor mu */
  .then(function(){
    if(!window.__v){var z=add("Şablonlar");set(z,"err","Test videosu yüklenemediği için şablonlar denenemedi.");return}
    var akt=(S.aktif&&S.aktif.length)?B360E.TEMPLATES.filter(function(t){return S.aktif.indexOf(t.id)>=0}):B360E.TEMPLATES;
    var pak=S.paket||"efektli";
    if(pak==="editsiz"){var z2=add("Şablonlar");set(z2,"ok","Editsiz paket — şablon kullanılmıyor, ham video veriliyor. Bulut işlemi yok.");return}
    var sira=Promise.resolve();
    akt.forEach(function(t){
      sira=sira.then(function(){
        var dd=add(t.e+" "+t.n);
        var sp={c:CLD,p:window.__v.pid,v:window.__v.ver,t:t.id,d:window.__v.dur,f:S.yuzSn||0,r:S.turSn||10,
          l:S.logoPid||"",lp:S.logoPoz||"ne",lw:S.logoW||"0.22",
          m:(S.tplMusic&&S.tplMusic[t.id])||S.muzikSec||"",
          x:(pak==="efektli"&&S.fxMode!=="off")?(S.fxMode||"green"):"off",fp:FXP,
          k:(S.kadraj==="genis916")?"g916":"",o:Object.assign({tol:S.fxTol||25},S.flags||{})};
        var u=B360E.url(sp),cikti=B360E.plan(sp).out;
        return bekle(u,110).then(function(r){
          toplamSn+=cikti;
          if(r.s===200)set(dd,"ok","Hazırlandı ✔ "+r.sn+" sn'de · çıktı ≈"+Math.round(cikti)+" sn · maliyet ≈"+tl(cikti).toFixed(2)+" TL");
          else set(dd,"err","HAZIRLANAMADI (HTTP "+r.s+") — bu şablonu panelden kapat. "+(r.e||""));
        });
      });
    });
    return sira;
  })
  /* 10 — karekod sayfası */
  .then(function(){d=add("Karekod sayfası (v.html)");
    var b=(S.siteUrl&&/^https?:\/\//i.test(S.siteUrl))?S.siteUrl.replace(/[^\/]*$/,""):location.href.split(/[?#]/)[0].replace(/[^\/]*$/,"");
    if(!/^https?:/i.test(b)){set(d,"err","Sayfa http(s) ile açılmamış — iPhone kamerası karekodu okur ama 'kullanılabilir veri yok' der. GitHub Pages adresinden aç.");return}
    return head(b+"v.html",20000).then(function(x){
      if(x.s===200)set(d,"ok","Açılıyor: "+b+"v.html");
      else set(d,"err","Ulaşılamıyor ("+x.s+"): "+b+"v.html — Panel → Site adresi'ni düzelt.");
    });
  })
  /* 11 — galeri (video/list kısıtı) */
  .then(function(){d=add("Etkinlik galerisi");
    return fetch("https://res.cloudinary.com/"+encodeURIComponent(CLD)+"/video/list/"+encodeURIComponent(slug()+"-360")+".json",{cache:"no-store"})
      .then(function(r){
        if(r.status===200)return r.json().then(function(j){set(d,"ok",((j.resources||[]).length)+" video listeleniyor. Galeri bağlantısı çalışıyor.")});
        if(r.status===404)set(d,"ok","Liste boş (bu etkinlikte henüz video yok) — kısıt yok, galeri çalışacak.");
        else set(d,"warn","Liste kapalı (HTTP "+r.status+"). Cloudinary → Settings → Security → 'Resource list' kısıtını kaldır. Karekod yine de çalışır.");
      },function(){set(d,"warn","Liste okunamadı — galeri sayfası boş görünebilir. Karekod teslimatı etkilenmez.")});
  })
  /* 12 — telefon durumu */
  .then(function(){d=add("Telefon");
    var wl=("wakeLock" in navigator),ls=true;
    try{localStorage.setItem("_b360t","1");localStorage.removeItem("_b360t")}catch(e){ls=false}
    var p=Promise.resolve(null);
    try{if(navigator.getBattery)p=navigator.getBattery()}catch(e){}
    return p.then(function(b){
      var yuzde=b?Math.round(b.level*100):null, sarj=b?b.charging:false;
      var t=[];
      t.push(wl?"ekran uyanık kalabiliyor ✔":"ekran uyanık tutulamıyor (telefon uyursa çekim kesilir — Ayarlar → Ekran Kilidi: Asla)");
      t.push(ls?"ayar hafızası yazılabiliyor ✔":"HAFIZA KAPALI (Özel Gezinme?) — ayarlar kaydedilmez");
      if(yuzde!==null)t.push("batarya %"+yuzde+(sarj?" (şarjda)":""));
      var dur=(!ls)?"err":((yuzde!==null&&yuzde<30&&!sarj)||!wl?"warn":"ok");
      if(yuzde!==null&&yuzde<30&&!sarj)t.push("← ŞARJA TAK, etkinlik boyunca yetmez");
      set(d,dur,t.join(" · "));
    });
  })
  /* özet */
  .then(function(){
    var sn=Math.round((Date.now()-t0)/1000),s=$("#sum");
    s.hidden=false;s.className="sum "+(hata?"err":"ok");
    var mal=toplamSn?("<br>Bu kontrol yaklaşık <b>"+tl(toplamSn).toFixed(2)+" TL</b> bulut maliyeti üretti ("+Math.round(toplamSn)+" sn render)."):"";
    s.innerHTML=hata
      ? '<span class="big">'+hata+' HATA var — böyle sahaya çıkma.</span><br>Kırmızı satırların altındaki yönergeyi uygula, kontrolü tekrar çalıştır.'+(uyari?(" ("+uyari+" uyarı da var.)"):"")+mal
      : '<span class="big">Her şey hazır.</span>'+(uyari?(" "+uyari+" uyarı var — okumakta fayda var, ama iş görür."):"")+'<br>'+sn+' saniyede tamamlandı.'+mal;
    $("#foot").innerHTML="Test videoları <code>booth360/_deneme</code> klasörüne gider, misafir galerisine karışmaz. Kontrolü etkinlik sabahı ve mekân wifi'sine bağlandıktan sonra bir kez daha çalıştır.";
    $("#run").disabled=false;$("#run").textContent="Tekrar çalıştır";$("#kopya").hidden=false;
    window.__rapor="OBSKURA 360 SAHA KONTROLÜ — "+new Date().toLocaleString("tr-TR")+"\n"+
      "cloud="+CLD+" preset="+PRE+" etkinlik="+(S.evt||"-")+" paket="+(S.paket||"-")+"\n"+
      navigator.userAgent+"\n\n"+rap.join("\n")+"\n\nHATA: "+hata+" · UYARI: "+uyari;
  });
};
$("#kopya").onclick=function(){var b=$("#kopya");
  try{navigator.clipboard.writeText(window.__rapor||"").then(function(){b.textContent="Kopyalandı — sohbete yapıştır"})}catch(e){}
  setTimeout(function(){b.textContent="Sonucu kopyala"},3000)};
})();
</script>
</body>
</html>
