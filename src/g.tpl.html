<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<meta name="theme-color" content="#12100E">
<title>OBSKURA 360 — etkinlik galerisi</title>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Figtree:wght@400;600;800&display=swap">
<style>
:root{--ink:#12100E;--ink2:#1B1714;--line:rgba(243,237,228,.14);--line2:rgba(243,237,228,.3);--paper:#F6F0E6;--text:#F3EDE4;--muted:#A79688;--amber:#F2A93B;
  --disp:"Instrument Serif",Georgia,serif;--ui:"Figtree",-apple-system,"Segoe UI",sans-serif}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
[hidden]{display:none!important}
html,body{margin:0;min-height:100%;background:var(--ink);color:var(--text);font-family:var(--ui)}
.wrap{max-width:1100px;margin:0 auto;padding:28px 18px 60px}
.head{text-align:center;margin-bottom:26px}
.eyebrow{font-family:var(--disp);letter-spacing:.34em;font-size:12px;color:var(--muted);text-transform:uppercase}
h1{font-family:var(--disp);font-style:italic;font-weight:400;font-size:clamp(28px,5vw,44px);margin:8px 0 6px;color:var(--paper)}
h1 em{color:var(--amber);font-style:italic}
.sub{color:var(--muted);font-size:14px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:12px}
.cell{position:relative;border-radius:14px;overflow:hidden;border:1px solid var(--line);background:#000;aspect-ratio:9/16;cursor:pointer}
.cell video,.cell img{width:100%;height:100%;object-fit:cover;display:block}
.cell .ply{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:30px;color:rgba(255,255,255,.85);text-shadow:0 2px 12px #000;pointer-events:none}
.msg{text-align:center;color:var(--muted);font-size:14px;line-height:1.7;padding:40px 10px}
.btn{display:inline-flex;align-items:center;justify-content:center;min-height:52px;padding:0 22px;border:none;border-radius:999px;font-family:var(--ui);font-weight:600;font-size:15px;background:var(--amber);color:#1A1206;cursor:pointer;text-decoration:none}
.btn.ghost{background:transparent;color:var(--text);box-shadow:inset 0 0 0 1.5px var(--line2)}
.row{display:flex;gap:10px;flex-wrap:wrap;justify-content:center;margin:20px 0}
#lb{position:fixed;inset:0;background:rgba(8,7,6,.94);display:none;align-items:center;justify-content:center;flex-direction:column;padding:16px;z-index:50}
#lb.on{display:flex}
#lbv{max-width:min(420px,92vw);max-height:70vh;border-radius:14px;background:#000}
footer{margin-top:34px;text-align:center;font-family:var(--disp);letter-spacing:.3em;font-size:11px;color:var(--muted);text-transform:uppercase}
</style>
</head>
<body>
<div class="wrap">
  <div class="head">
    <div class="eyebrow">OBSKURA 360</div>
    <h1 id="baslik">Etkinlik <em>galerisi</em></h1>
    <div class="sub" id="alt">Yükleniyor…</div>
  </div>
  <div class="row" id="zipRow" hidden><button class="btn ghost" id="zipBtn">Tümünü indir</button><span class="msg" id="zipNot" style="padding:0;font-size:13px"></span></div>
  <div class="grid" id="grid"></div>
  <div class="msg" id="msg" hidden></div>
  <footer>Anı burada döner</footer>
</div>
<div id="lb"><video id="lbv" controls playsinline></video>
  <div class="row"><button class="btn" id="lbSave">Kaydet / paylaş</button><button class="btn ghost" id="lbClose">Kapat</button></div>
</div>
<script>
(function(){
"use strict";
function $(s){return document.querySelector(s)}
var q=new URLSearchParams(location.hash.replace(/^#/,""));
var cloud=q.get("c")||"", tag=q.get("t")||"", evt=q.get("e")||"", zipAcik=q.get("z")==="1";
if(evt)$("#baslik").innerHTML=evt.replace(/</g,"&lt;")+" <em>galerisi</em>";
function base(){return "https://res.cloudinary.com/"+encodeURIComponent(cloud)+"/video/upload/"}
function poster(pid,ver){return base()+"so_1/c_fill,w_320,h_568/v"+ver+"/"+pid+".jpg"}
function vurl(pid,ver){return base()+"q_auto/v"+ver+"/"+pid+".mp4"}
function hata(t){$("#msg").hidden=false;$("#msg").innerHTML=t;$("#alt").textContent=""}
if(!cloud||!tag){hata("Bağlantı eksik — galeri adresini yeniden alın.");}
else{
  fetch("https://res.cloudinary.com/"+encodeURIComponent(cloud)+"/video/list/"+encodeURIComponent(tag)+".json",{cache:"no-store"})
  .then(function(r){if(!r.ok)throw new Error("HTTP "+r.status);return r.json()})
  .then(function(j){
    var rs=(j.resources||[]).filter(function(x){return x.public_id.indexOf("/_")<0});
    rs.sort(function(a,b){return (b.created_at||"")<(a.created_at||"")?-1:1});
    if(!rs.length){hata("Bu etkinlikte henüz video yok.");return}
    $("#alt").textContent=rs.length+" video · karta dokunup izleyin, kaydedin";
    if(zipAcik&&rs.length){
      $("#zipRow").hidden=false;
      $("#zipNot").textContent=rs.length+" video · bilgisayarda yapın, telefonda takılabilir";
      $("#zipBtn").onclick=function(){topluIndir(rs)};
    }
    var g=$("#grid");
    rs.forEach(function(x){
      var c=document.createElement("div");c.className="cell";
      c.innerHTML='<img loading="lazy" src="'+poster(x.public_id,x.version)+'" alt=""><div class="ply">▶</div>';
      c.onclick=function(){ac(vurl(x.public_id,x.version))};
      g.appendChild(c);
    });
  })
  .catch(function(e){
    hata("Galeri okunamadı ("+((e&&e.message)||"hata")+").<br>Cloudinary → Settings → Security → <b>Resource list</b> kısıtı kapalı olmalı.");
  });
}
/* TOPLU İNDİRME (opsiyonel — müşteri tüm videoları isterse).
   Cloudinary başka bir alan adı olduğu için <a download> çalışmıyor; her dosya
   tek tek indirilip blob olarak kaydediliyor. Sırayla, biri bitmeden diğeri başlamıyor. */
function topluIndir(rs){
  var b=$("#zipBtn"),n=$("#zipNot"),i=0,hata=0,iptal=false;
  b.textContent="Durdur";
  b.onclick=function(){iptal=true;n.textContent="Durduruluyor…"};
  function ad(x,k){return (evt?evt.replace(/[^\wğüşıöçĞÜŞİÖÇ -]/g,"").trim().replace(/\s+/g,"_"):"obskura")+"_"+String(k+1).padStart(3,"0")+".mp4"}
  function sira(){
    if(iptal||i>=rs.length){
      b.textContent="Tümünü indir";b.onclick=function(){topluIndir(rs)};
      n.textContent=iptal?("Durduruldu — "+i+" video indi."):(i+" video indi"+(hata?(", "+hata+" tanesi inemedi"):"."));
      return;
    }
    var x=rs[i];
    n.textContent=(i+1)+" / "+rs.length+" indiriliyor…";
    fetch(vurl(x.public_id,x.version)).then(function(r){if(!r.ok)throw 0;return r.blob()}).then(function(bl){
      var a=document.createElement("a");a.href=URL.createObjectURL(bl);a.download=ad(x,i);
      document.body.appendChild(a);a.click();
      setTimeout(function(){URL.revokeObjectURL(a.href);a.remove()},4000);
    }).catch(function(){hata++}).then(function(){i++;setTimeout(sira,900)});
  }
  sira();
}
var cur="";
function ac(u){cur=u;$("#lbv").src=u;$("#lb").classList.add("on");$("#lbv").play&&$("#lbv").play().catch(function(){})}
$("#lbClose").onclick=function(){$("#lb").classList.remove("on");$("#lbv").pause();$("#lbv").removeAttribute("src")};
$("#lbSave").onclick=function(){
  var b=$("#lbSave"),old=b.textContent;b.textContent="İndiriliyor…";b.disabled=true;
  fetch(cur).then(function(r){return r.blob()}).then(function(bl){
    var f=new File([bl],"obskura360.mp4",{type:"video/mp4"});
    if(navigator.canShare&&navigator.canShare({files:[f]}))return navigator.share({files:[f],title:"OBSKURA 360"});
    var a=document.createElement("a");a.href=URL.createObjectURL(bl);a.download="obskura360.mp4";document.body.appendChild(a);a.click();
    setTimeout(function(){URL.revokeObjectURL(a.href);a.remove()},4000);
  }).catch(function(){window.open(cur,"_blank")}).then(function(){b.disabled=false;b.textContent=old});
};
window.B360G={cloud:cloud,tag:tag};
})();
</script>
</body>
</html>
